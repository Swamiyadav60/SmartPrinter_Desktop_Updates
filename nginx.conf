# /etc/nginx/sites-available/software.smartprinter.in
server {
    listen 80;
    listen [::]:80;
    server_name software.smartprinter.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name software.smartprinter.in;

    # SSL Certificates (managed via Certbot / Let's Encrypt or Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/software.smartprinter.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/software.smartprinter.in/privkey.pem;

    root /var/www/software.smartprinter.in/dist;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Large File Downloads & Byte Ranges (Required for Electron blockmap differential updates)
    client_max_body_size 500M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Health check endpoint
    location = /health {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /health =404;
    }

    # Isolated Update Channel Files (latest.yml, .exe, .blockmap)
    location ^~ /desktop/ {
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes always;

        # Disable caching for latest.yml so clients immediately see new versions
        location ~* latest\.ya?ml$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
            default_type text/yaml;
        }

        # Cache immutable binary installer and blockmap files
        location ~* \.(exe|blockmap|zip)$ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Accept-Ranges bytes always;
        }
    }

    # SPA Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
